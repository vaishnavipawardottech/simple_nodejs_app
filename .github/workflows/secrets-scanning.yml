# GOAL: 

name: secret-scan

on:
    workflow_call:

jobs:
    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: Scan for leaks
              uses: dortort/betterleaks-action@v0.1.0
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                config: .github/.gitleaks.toml
              continue-on-error: true