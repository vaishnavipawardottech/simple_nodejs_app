# GOAL: Lint the code in the repository

name: Lint and test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    # workflow_dispatch:


jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            project: [frontend, backend]
        defaults:
            run:
                working-directory: ${{ matrix.project }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup node.js
              uses: actions/setup-node@v7
              with:
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run ESlint
              run: npm run lint

            - name: run tests
              run: npm run test

    