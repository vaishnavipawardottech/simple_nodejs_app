# GOAL: to build and push frontend and backend docker images

name: Docker Build and Push

on:
    push:
        branches:
            - main

jobs:
    frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Docker setup
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and push frontend
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                file: ./frontend/Dockerfile.multistage
                push: true
                tags: |
                    "${{ vars.DOCKER_USERNAME }}/asset-tracker-frontend:multistage"


    backend:
        runs-on: ubuntu-latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Docker setup
              uses: docker/setup-docker-action@v5

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and push backend
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                file: ./backend/Dockerfile.multistage
                push: true
                tags: |
                    "${{ vars.DOCKER_USERNAME }}/asset-tracker-backend:multistage"