# GOAL: Lint the code in the repository

name: Lint

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main


jobs:
    frontend-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup node.js
              uses: actions/setup-node@v7
              with:
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run ESlint
              run: npm run lint

    backend-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup node.js
              uses: actions/setup-node@v7
              with: 
                node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run ESlint
              run: npm run lint

